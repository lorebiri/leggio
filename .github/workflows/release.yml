# Pacchetti di installazione: parte quando si spinge un tag vX.Y.Z.
# Costruisce su macOS, Windows e Linux e carica tutto in una BOZZA di release GitHub, con il file
# SHA256SUMS.txt (impronte SHA-256 di ogni pacchetto). La bozza va controllata e pubblicata a mano
# (vedi docs/RILASCIO.md). Avviato a mano (workflow_dispatch) costruisce i pacchetti senza pubblicarli:
# si scaricano dagli artefatti del run.
#
# FIRMA DEL CODICE (pronta, spenta finché mancano i segreti): vedi docs/FIRMA-DEL-CODICE.md
#   - Windows: variabile del repository FIRMA_WINDOWS = "signpath" oppure "azure" (vuota = nessuna firma)
#       signpath → segreto SIGNPATH_API_TOKEN, variabili SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#                  SIGNPATH_POLICY_SLUG (es. release-signing)
#       azure    → segreti AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; variabili AZURE_SIGN_ENDPOINT,
#                  AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER
#   - macOS: segreti CSC_LINK, CSC_KEY_PASSWORD (Developer ID), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pubblica:
        description: 'Avviato su un tag: pubblica la release (non più bozza) alla fine'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  bozza:
    name: Prepara la bozza di release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Controlla che il tag corrisponda alla versione di package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Il tag ${GITHUB_REF_NAME} non corrisponde alla versione $v di package.json"
            exit 1
          fi
      - name: Crea la bozza con note automatiche (se non esiste già)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release ${GITHUB_REF_NAME} esiste già: aggiungo solo i file."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft --generate-notes --title "Leggio ${GITHUB_REF_NAME#v}" --verify-tag
          fi

  pacchetti:
    name: Pacchetti ${{ matrix.nome }}
    needs: bozza
    # gira anche quando «bozza» è saltato (avvio manuale), ma non se è fallito
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: macOS
            args: --mac
          - os: windows-latest
            nome: Windows
            args: --win
          - os: ubuntu-latest
            nome: Linux
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FIRMA_WINDOWS: ${{ vars.FIRMA_WINDOWS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepara i dati OCR
        if: hashFiles('scripts/prepara-ocr.mjs') != ''
        run: node scripts/prepara-ocr.mjs
      - run: npm test
      - run: npx vite build

      # ---------- macOS (firma Developer ID + notarizzazione se ci sono i segreti, altrimenti ad hoc) ----------
      - name: Costruisci i pacchetti macOS
        if: matrix.nome == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # Le variabili vuote vanno tolte: electron-builder legge CSC_LINK="" come un percorso ("not a file").
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "macOS: nessun certificato, firma ad hoc."; fi
          npx electron-builder --config scripts/config-firma.cjs --mac --publish never

      # ---------- Linux ----------
      - name: Costruisci il pacchetto Linux
        if: matrix.nome == 'Linux'
        run: npx electron-builder --config scripts/config-firma.cjs --linux --publish never

      # ---------- Windows: senza firma o con Azure Trusted Signing (firma fatta da electron-builder) ----------
      - name: Costruisci i pacchetti Windows
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS != 'signpath'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: npx electron-builder --config scripts/config-firma.cjs --win --publish never

      # ---------- Windows con SignPath (gratuito per progetti open source) ----------
      # 1) app non impacchettata → SignPath firma Leggio.exe e le DLL; 2) installer e portatile costruiti dall'app
      #    firmata → SignPath firma i due .exe finali. La configurazione dell'artefatto sta su SignPath (vedi docs).
      - name: "SignPath 1/4: app non impacchettata"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --config scripts/config-firma.cjs --win --dir --publish never
      - name: "SignPath 2/4: carica l'app da firmare"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        id: app-da-firmare
        uses: actions/upload-artifact@v4
        with: { name: app-da-firmare, path: release/win-unpacked, retention-days: 1 }
      - name: "SignPath 2/4: firma dell'app"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-da-firmare.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/win-unpacked-firmata
      - name: "SignPath 3/4: installer e portatile dall'app firmata"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        shell: bash
        run: |
          rm -rf release/win-unpacked
          npx electron-builder --config scripts/config-firma.cjs --win --prepackaged release/win-unpacked-firmata --publish never
          mkdir -p release/da-firmare && mv release/Leggio-*.exe release/da-firmare/
      - name: "SignPath 4/4: carica gli installer da firmare"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        id: installer-da-firmare
        uses: actions/upload-artifact@v4
        with: { name: installer-da-firmare, path: release/da-firmare, retention-days: 1 }
      - name: "SignPath 4/4: firma degli installer"
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS == 'signpath'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-da-firmare.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      - name: Verifica la firma Authenticode (solo se la firma è attiva)
        if: matrix.nome == 'Windows' && env.FIRMA_WINDOWS != ''
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem release/Leggio-*.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) — $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "Firma non valida su $($f.Name)" }
          }
      - name: Verifica che il pacchetto contenga i moduli del processo main
        if: env.FIRMA_WINDOWS != 'signpath' || matrix.nome != 'Windows'
        run: node scripts/verifica-pacchetto.mjs
      - name: Conserva i pacchetti come artefatti del workflow
        uses: actions/upload-artifact@v4
        with:
          name: leggio-${{ matrix.nome }}
          path: |
            release/Leggio-*.dmg
            release/Leggio-*.zip
            release/Leggio-*.exe
            release/Leggio-*.AppImage
          if-no-files-found: error
          retention-days: 14

  impronte:
    name: Impronte SHA-256 e caricamento nella bozza
    needs: pacchetti
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: leggio-*
          merge-multiple: true
          path: pacchetti
      - name: Calcola SHA256SUMS.txt
        working-directory: pacchetti
        run: |
          sha256sum Leggio-* | tee SHA256SUMS.txt
      - name: Conserva le impronte come artefatto
        uses: actions/upload-artifact@v4
        with: { name: leggio-SHA256SUMS, path: pacchetti/SHA256SUMS.txt, retention-days: 14 }
      - name: Carica pacchetti e impronte nella bozza (solo dai tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: pacchetti
        run: gh release upload "${GITHUB_REF_NAME}" Leggio-* SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber

  pubblica:
    name: Pubblica la release e aggiorna il sito
    needs: impronte
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && inputs.pubblica }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Controlla che ci siano tutti i file
        run: |
          n=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')
          echo "File nella release: $n"
          if [ "$n" -lt 8 ]; then echo "::error::Mancano file nella release ($n invece di 8)"; exit 1; fi
      - name: Pubblica come ultima versione
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
      # Una release pubblicata con GITHUB_TOKEN non avvia altri workflow: il sito va lanciato a mano.
      - name: Aggiorna il sito
        run: gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
